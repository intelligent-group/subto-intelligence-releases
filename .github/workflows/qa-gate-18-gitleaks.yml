name: QA Gate 18 - Gitleaks Secret Scan

# Scans every commit + every PR for hardcoded credentials (API keys, tokens,
# private keys, connection strings) using gitleaks. Hard gate: any leak
# detected fails the PR.
#
# This repo is PUBLIC: the org's self-hosted runner group has
# allows_public_repositories=false (GitHub blocks self-hosted runners on
# public repos by design, to stop an untrusted fork PR from running arbitrary
# code on our own hardware) -- a job requesting [self-hosted,
# mroot-self-hosted] here queues forever with no runner ever picking it up.
# ubuntu-latest is used instead, which is free/unlimited on public repos, so
# this is not a billable-cost decision.
#
# Ship dispatch-only first (issue #7404): no schedule cron here yet. Prove
# one real run lands clean on a PR/push, then a follow-up can arm a weekly
# full-history sweep -- see memory/feedback_pilot_verify_before_arming_schedule.md.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest  # runner-policy-ok: hosted-only: PUBLIC repo - org runner group disallows public repos on self-hosted runners (allows_public_repositories=false), and GitHub-hosted minutes are free for public repos; self-hosted is also unsafe for untrusted fork PRs here
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # QA Gate 18 install + hard-gate scan live ONCE in gha-lib (ait-claude-config#13059).
      - name: Gitleaks secret scan (gha-lib)
        uses: intelligent-group/gha-lib/actions/gitleaks-scan@v1

